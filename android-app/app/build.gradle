plugins {
    id "com.android.application"
}

android {
    namespace "com.deepsignal.dongzhou"
    compileSdk 36
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.deepsignal.dongzhou"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "0.5.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs = ["src/main/assets", "../../web-game", "../../unity-remake/Assets/Resources/Models"]
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

dependencies {
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.31.1"
}
